<div class="flex items-center justify-between">
  <div>
    <h1 class="text-xl font-semibold tracking-tight">Users</h1>
    <p class="mt-1 text-sm text-slate-500">Who can sign in, and who administers the system.</p>
  </div>
  <button
    type="button"
    (click)="startNew()"
    class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700"
  >
    Add user
  </button>
</div>

<div class="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white">
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-slate-100 text-left text-xs text-slate-500">
        <th class="px-5 py-3 font-medium">Name</th>
        <th class="px-3 py-3 font-medium">Email</th>
        <th class="px-3 py-3 font-medium">Role</th>
        <th class="px-3 py-3"></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr class="border-b border-slate-50 last:border-0">
          <td class="px-5 py-3 font-medium">{{ user.name }}</td>
          <td class="px-3 py-3 text-slate-500">{{ user.email }}</td>
          <td class="px-3 py-3">
            <span
              class="rounded-full px-2.5 py-0.5 text-xs"
              [class]="user.role === 'Admin' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'"
            >
              {{ user.role }}
            </span>
          </td>
          <td class="px-3 py-3 text-right">
            <button
              type="button"
              (click)="startEdit(user)"
              class="rounded-lg px-3 py-1 text-xs text-indigo-600 transition hover:bg-indigo-50"
            >
              Edit
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (draft(); as d) {
  <div class="fixed inset-0 z-40 grid place-items-center p-4">
    <button type="button" class="absolute inset-0 w-full bg-slate-900/40" aria-label="Close" (click)="draft.set(null)"></button>
    <div class="relative w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl" role="dialog" aria-modal="true">
      <h2 class="text-lg font-semibold">{{ d.id ? 'Edit user' : 'Add user' }}</h2>
      <div class="mt-4 flex flex-col gap-4">
        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-600">Name</span>
          <input type="text" [(ngModel)]="d.name" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
        </label>
        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-600">Email</span>
          <input type="email" [(ngModel)]="d.email" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
        </label>
        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-600">Role</span>
          <select [(ngModel)]="d.role" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500">
            @for (role of roles; track role) {
              <option [ngValue]="role">{{ role }}</option>
            }
          </select>
        </label>
      </div>

      @if (error(); as message) {
        <p class="mt-3 text-sm text-rose-600">{{ message }}</p>
      }

      <div class="mt-5 flex justify-end gap-2">
        <button type="button" (click)="draft.set(null)" class="rounded-xl px-4 py-2 text-sm text-slate-600 transition hover:bg-slate-100">
          Cancel
        </button>
        <button
          type="button"
          (click)="save()"
          [disabled]="saving() || !d.name.trim() || !d.email.trim()"
          class="rounded-xl bg-indigo-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 disabled:opacity-50"
        >
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </div>
  </div>
}
