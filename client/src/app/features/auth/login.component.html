<div class="grid min-h-screen place-items-center bg-slate-100 px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm">
    <div class="mb-1 flex items-center gap-2">
      <span
        class="grid size-9 place-items-center rounded-lg bg-indigo-600 text-lg font-bold text-white"
        >B</span
      >
      <h1 class="text-xl font-semibold tracking-tight">Bookable</h1>
    </div>
    <p class="mb-6 text-sm text-slate-500">
      Book meeting rooms, pool cars and catering. Demo mode — pick a user to sign in.
    </p>

    <div class="flex flex-col gap-2">
      @for (user of users(); track user.id) {
        <button
          type="button"
          (click)="pick(user)"
          class="flex items-center justify-between rounded-xl border border-slate-200 px-4 py-3 text-left transition hover:border-indigo-400 hover:bg-indigo-50"
        >
          <span class="font-medium">{{ user.name }}</span>
          <span
            class="rounded-full px-2.5 py-0.5 text-xs font-medium"
            [class]="
              user.role === 'Admin'
                ? 'bg-indigo-100 text-indigo-700'
                : 'bg-slate-100 text-slate-600'
            "
          >
            {{ user.role }}
          </span>
        </button>
      } @empty {
        <div class="py-8 text-center text-sm text-slate-400">Loading users…</div>
      }
    </div>
  </div>
</div>
