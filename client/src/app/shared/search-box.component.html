<label class="relative block">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    class="absolute top-1/2 left-3 size-4 -translate-y-1/2 text-slate-400"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" />
  </svg>
  <input
    type="search"
    [value]="value()"
    (input)="onInput($event)"
    [placeholder]="placeholder()"
    class="w-64 rounded-xl border border-slate-200 bg-white py-2 pr-3 pl-9 text-sm outline-none transition focus:border-indigo-500"
  />
</label>
