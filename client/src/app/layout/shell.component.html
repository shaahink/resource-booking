<div class="flex min-h-screen">
  <!-- Sidenav -->
  <aside class="flex w-60 shrink-0 flex-col border-r border-slate-200 bg-white">
    <div class="flex items-center gap-2 px-5 py-5">
      <span class="grid size-8 place-items-center rounded-lg bg-indigo-600 font-bold text-white">B</span>
      <span class="text-lg font-semibold tracking-tight">Bookable</span>
    </div>

    <nav class="flex flex-1 flex-col gap-1 px-3 py-2 text-sm">
      <a routerLink="/resources" routerLinkActive="nav-active" class="nav-link">Resources</a>
      <a routerLink="/my-bookings" routerLinkActive="nav-active" class="nav-link">My bookings</a>

      @if (auth.isAdmin()) {
        <div class="mt-4 px-3 pb-1 text-xs font-semibold tracking-wide text-slate-400 uppercase">Admin</div>
        <a routerLink="/admin/dashboard" routerLinkActive="nav-active" class="nav-link">Dashboard</a>
        <a routerLink="/admin/resources" routerLinkActive="nav-active" class="nav-link">Manage resources</a>
        <a routerLink="/admin/users" routerLinkActive="nav-active" class="nav-link">Users</a>
        <a routerLink="/admin/history" routerLinkActive="nav-active" class="nav-link">Usage history</a>
      }
    </nav>

    <div class="border-t border-slate-200 px-5 py-4 text-sm">
      <div class="font-medium">{{ auth.currentUser()?.name }}</div>
      <div class="text-xs text-slate-500">{{ auth.currentUser()?.role }}</div>
      <button type="button" (click)="auth.logout()" class="mt-2 text-xs text-indigo-600 hover:underline">
        Switch user
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Top bar -->
    <header class="flex items-center justify-end border-b border-slate-200 bg-white px-6 py-2.5">
      <div class="relative">
        <button
          type="button"
          (click)="toggleBell()"
          class="relative grid size-9 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-100"
          aria-label="Notifications"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
          </svg>
          @if (unreadCount() > 0) {
            <span class="absolute -top-0.5 -right-0.5 grid size-4.5 place-items-center rounded-full bg-rose-500 text-[10px] font-semibold text-white">
              {{ unreadCount() }}
            </span>
          }
        </button>

        @if (bellOpen()) {
          <div class="absolute right-0 z-30 mt-2 w-80 rounded-2xl border border-slate-200 bg-white p-2 shadow-lg">
            @for (notification of notifications(); track notification.id) {
              <button
                type="button"
                (click)="markRead(notification)"
                class="block w-full rounded-xl px-3 py-2.5 text-left text-sm transition hover:bg-slate-50"
                [class.opacity-60]="notification.readAt"
              >
                <span class="flex items-start gap-2">
                  @if (!notification.readAt) {
                    <span class="mt-1.5 size-2 shrink-0 rounded-full bg-indigo-500"></span>
                  }
                  <span>
                    {{ notification.message }}
                    <span class="mt-0.5 block text-xs text-slate-400">
                      {{ notification.createdOn | date: 'EEE d MMM HH:mm' }}
                    </span>
                  </span>
                </span>
              </button>
            } @empty {
              <p class="px-3 py-6 text-center text-sm text-slate-400">Nothing yet.</p>
            }
          </div>
        }
      </div>
    </header>

    <main class="min-w-0 flex-1 px-8 py-6">
      <router-outlet />
    </main>
  </div>
</div>
